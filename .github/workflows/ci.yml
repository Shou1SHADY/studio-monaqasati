name: CI - مناقصتي

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # ===========================================================================
  # Job 1: Code Quality
  # ===========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: TypeScript type check
        run: npm run typecheck
        
      - name: ESLint
        run: npm run lint
        
      - name: Build check
        run: npm run build

  # ===========================================================================
  # Job 2: Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run unit tests
        run: npm run test -- --passWithNoTests
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests

  # ===========================================================================
  # Job 3: E2E Tests
  # ===========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        
      - name: Start dev server
        run: npm run dev &
        timeout-minutes: 2
        
      - name: Wait for server
        run: sleep 15
        
      - name: Run E2E tests
        run: npm run e2e
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # Job 4: Security Audit
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run security audit
        run: npm audit --audit-level=medium
        
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.ref_name }}

  # ===========================================================================
  # Job 5: UI/UX Validation
  # ===========================================================================
  ui-validation:
    name: UI/UX Validation
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Validate Tailwind config
        run: npx tailwindcss --init --dry-run
        
      - name: Check RTL support
        run: |
          if grep -q "dir=\"rtl\"" src/app/layout.tsx; then
            echo "✓ RTL support configured"
          else
            echo "⚠ RTL support not found"
          fi

  # ===========================================================================
  # Job 6: Firebase Rules Validation
  # ===========================================================================
  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Firebase
        run: npm install -g firebase-tools
        
      - name: Validate Firestore rules
        run: |
          if [ -f "firestore.rules" ]; then
            echo "✓ Firestore rules file exists"
            # Note: Requires Firebase project for full validation
            # firebase projects:list to see available projects
          fi
          
      - name: Check rules patterns
        run: |
          if grep -q "allow read, write: if true" firestore.rules; then
            echo "⚠ Warning: Overly permissive rules detected"
          else
            echo "✓ No overly permissive rules found"
          fi

  # ===========================================================================
  # Job 7: Bundle Analysis (optional)
  # ===========================================================================
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Analyze bundle
        run: |
          if [ -d ".next/static" ]; then
            echo "Static bundles:"
            find .next/static -type f -name "*.js" -exec wc -c {} \; | sort -rn | head -10
          fi

  # ===========================================================================
  # Summary Report
  # ===========================================================================
  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, e2e-tests, security, ui-validation, firebase-rules, bundle-analysis]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Code Quality
          if [ "${{ needs.code-quality.result }}" == "success" ]; then
            echo "| Code Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Unit Tests
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # E2E Tests
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "| E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| E2E Tests | ⚠️ Skipped/Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security
          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "| Security | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security | ⚠️ Warnings |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total jobs: 7" >> $GITHUB_STEP_SUMMARY