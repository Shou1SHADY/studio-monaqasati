name: CI - مدماك تيك

on:
  push:
    branches: [main, develop, 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # ===========================================================================
  # Job 1: Code Quality
  # ===========================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ===========================================================================
  # Job 2: Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run unit tests
        run: npm run test -- --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ===========================================================================
  # Job 3: E2E Tests
  # ===========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start production server
        run: npm run start &
        env:
          PORT: 9002

      - name: Wait for server
        run: npx wait-on http://localhost:9002 --timeout 30000

      - name: Run E2E tests
        run: npm run e2e
        env:
          BASE_URL: http://localhost:9002

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ===========================================================================
  # Job 4: Security Audit
  # ===========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run security audit
        run: npm audit --audit-level=critical || true

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@v3.88.34
        with:
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.ref_name }}
        continue-on-error: true

  # ===========================================================================
  # Job 5: UI/UX Validation
  # ===========================================================================
  ui-validation:
    name: UI/UX Validation
    runs-on: ubuntu-latest
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check Tailwind config exists
        run: |
          if [ -f "tailwind.config.ts" ] || [ -f "tailwind.config.js" ]; then
            echo "✓ Tailwind config found"
          else
            echo "⚠ Tailwind config not found"
            exit 1
          fi

      - name: Check RTL/i18n support
        run: |
          if grep -rq "next-intl" src/ || grep -q "next-intl" package.json; then
            echo "✓ next-intl i18n (RTL/LTR) support configured"
          else
            echo "⚠ RTL/i18n support not found"
          fi

      - name: Check locales directory
        run: |
          if [ -d "messages" ] || [ -d "locales" ] || [ -d "src/messages" ]; then
            echo "✓ Locale message files found"
          else
            echo "⚠ No locale message directory found"
          fi

  # ===========================================================================
  # Job 6: Firebase Rules Validation
  # ===========================================================================
  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Firestore rules file exists
        run: |
          if [ -f "firestore.rules" ]; then
            echo "✓ Firestore rules file exists"
            wc -l firestore.rules
          else
            echo "✗ firestore.rules not found"
            exit 1
          fi

      - name: Check for overly permissive rules
        run: |
          if grep -q "allow read, write: if true" firestore.rules; then
            echo "⚠ Warning: Overly permissive rules detected"
          else
            echo "✓ No overly permissive rules found"
          fi

      - name: Check Storage rules file
        run: |
          if [ -f "storage.rules" ]; then
            echo "✓ Storage rules file exists"
          else
            echo "⚠ storage.rules not found (optional)"
          fi

  # ===========================================================================
  # Job 7: Bundle Analysis
  # ===========================================================================
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Analyze bundle
        run: |
          if [ -d ".next/static" ]; then
            echo "Static bundles (top 10 by size):"
            find .next/static -type f -name "*.js" -exec wc -c {} \; | sort -rn | head -10
          fi

  # ===========================================================================
  # Summary Report
  # ===========================================================================
  report:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, e2e-tests, security, ui-validation, firebase-rules, bundle-analysis]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.code-quality.result }}" == "success" ]; then
            echo "| Code Quality | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Quality | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Unit Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "| E2E Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| E2E Tests | ⚠️ Skipped/Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security.result }}" == "success" ]; then
            echo "| Security | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security | ⚠️ Warnings |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.ui-validation.result }}" == "success" ]; then
            echo "| UI Validation | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| UI Validation | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.firebase-rules.result }}" == "success" ]; then
            echo "| Firebase Rules | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Firebase Rules | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.bundle-analysis.result }}" == "success" ]; then
            echo "| Bundle Analysis | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Bundle Analysis | ⚠️ Warnings |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Total jobs: 7" >> $GITHUB_STEP_SUMMARY